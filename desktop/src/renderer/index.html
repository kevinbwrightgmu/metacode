<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MetaCode Sheets</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/reliability-stats.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="access" class="access" hidden></div>
  <div id="shell" class="shell" hidden>
    <nav id="doc-tabs" class="doc-tabs" aria-label="Open workbooks"></nav>
    <main id="main" class="main">
      <section id="home" class="home" aria-label="Home"></section>
      <section id="workbook" class="workbook" hidden aria-label="Workbook"></section>
    </main>
  </div>
  <div id="overlays"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript>MetaCode Sheets needs JavaScript.</noscript>
</body>
</html>
