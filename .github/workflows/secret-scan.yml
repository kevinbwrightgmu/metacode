# Secret scanning with TruffleHog (https://github.com/trufflesecurity/trufflehog).
# Pull requests scan their commits, pushes to main the commits they add. The
# job fails on a verified secret (one its provider accepted) or an unknown one
# (verification couldn't finish), so a leak is caught before it reaches main.
# Placeholders and test fixtures carry a `trufflehog:ignore` comment on their
# line. Older commits hold 7 placeholder URLs from before those comments, so a
# whole-history scan is run locally instead: docs/security.md.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # pinned to the v3.99.3 release commit
      - uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e
        with:
          version: 3.99.3
          extra_args: --results=verified,unknown
