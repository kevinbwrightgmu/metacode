<body class="studio-page">

<header class="st-top">
  <a class="st-brand" href="index.html" title="MetaCode home">
    <img src="img/metacode-mark.png" alt="" width="28" height="28">
    <span class="st-brand-name">MetaCode</span>
    <span class="st-brand-sep">/</span>
    <span class="st-brand-app">Survey Studio</span>
  </a>
  <nav class="st-nav" aria-label="MetaCode">
    <a href="index.html">Home</a>
    <a href="app.html">Coding app</a>
    <button type="button" class="st-tour" id="st-tour" title="Hands-on tutorial and a quick tour of Survey Studio">Tutorial &amp; tour</button>
    <span id="st-account" hidden></span>
  </nav>
</header>

<main class="view-container" id="view-container" aria-live="polite"></main>

      <button class="modal-x" id="modal-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- Notifications -->
<div class="notif-stack" id="notif-stack"></div>
