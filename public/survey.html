<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Survey</title>
  <link rel="icon" type="image/png" href="/img/metacode-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/survey.css">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--page-bg, #EEF2FF); font-family: 'Inter', system-ui, sans-serif; color: #0F172A; -webkit-font-smoothing: antialiased; }
    .svp-main { max-width: 100%; padding: 40px 16px 24px; }
    .svp-state { max-width: 520px; margin: 12vh auto 0; text-align: center; padding: 40px 28px; background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .svp-state h1 { font: 700 22px/1.25 'Space Grotesk', system-ui, sans-serif; margin: 0 0 8px; }
    .svp-state p { font-size: 14.5px; color: #475569; line-height: 1.6; margin: 0; }
    .svp-spinner { width: 28px; height: 28px; border: 3px solid #BFDBFE; border-top-color: #2563EB; border-radius: 50%; margin: 0 auto 14px; animation: svp-spin .8s linear infinite; }
    @keyframes svp-spin { to { transform: rotate(360deg); } }
    .svp-foot { text-align: center; font-size: 12px; color: #94A3B8; padding: 20px 16px 32px; }
    .svp-foot img { width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
    @media (max-width: 600px) { .svp-main { padding: 16px 8px; } }
  </style>
</head>
<body>
  <main class="svp-main" id="svp-main" aria-live="polite">
    <div class="svp-state" id="svp-state"><div class="svp-spinner" aria-hidden="true"></div><p>Loading the survey…</p></div>
  </main>
  <footer class="svp-foot"><img src="/img/metacode-mark.png" alt="">Made with MetaCode Survey Studio</footer>
  <script src="/js/survey/survey-core.js"></script>
  <script src="/js/survey/survey-logic.js"></script>
  <script src="/js/survey/survey-render.js"></script>
  <script src="/js/survey/survey-runtime.js"></script>
  <script src="/js/survey/survey-public.js"></script>
</body>
</html>
